name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend workflow verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify credential-free training workflow
        env:
          ENVIRONMENT: production
        run: python scripts/verify_demo.py
  frontend:
    name: Next.js production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deployment:
    name: Container integration check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Create temporary private deployment environment
        run: |
          python - <<'PY'
          import pathlib, secrets
          pathlib.Path('.env').write_text('SECRET_KEY=' + secrets.token_urlsafe(48) + '\nDEMO_MODE=true\n')
          PY
      - name: Validate and start services
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: Check public gateway routes
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost/
          curl --fail --retry 5 --retry-delay 3 http://localhost/api/health
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop temporary services
        if: always()
        run: docker compose down -v
